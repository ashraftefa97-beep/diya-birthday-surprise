:root{--bg:#fff8f6;--ink:#291522;--muted:#826d79;--pink:#ff4f93;--berry:#bd2d69;--violet:#7960ef;--line:#efdce5;--paper:rgba(255,255,255,.88)}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 8% 12%,#ffe1ed 0 11%,transparent 28%),radial-gradient(circle at 95% 90%,#eee7ff 0 12%,transparent 31%),linear-gradient(145deg,#fffaf6,#fff4f8 55%,#f8f5ff);color:var(--ink);font-family:'RabieExact',Tahoma,Arial,sans-serif}
.shell{width:min(680px,100%);position:relative}.spark{position:absolute;color:#e99bbc;font-size:38px;opacity:.85;animation:float 3s ease-in-out infinite}.spark.one{top:-25px;right:22px}.spark.two{bottom:-28px;left:28px;animation-delay:-1.4s}@keyframes float{50%{transform:translateY(-9px) rotate(9deg)}}
.card{position:relative;overflow:hidden;text-align:center;border:1px solid rgba(255,255,255,.9);border-radius:36px;padding:clamp(28px,7vw,58px);background:var(--paper);box-shadow:0 26px 80px rgba(98,48,75,.14);backdrop-filter:blur(16px)}.card:before,.card:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;z-index:-1;opacity:.52}.card:before{background:#ffd6e6;top:-100px;left:-95px}.card:after{background:#ffe9ad;bottom:-120px;right:-105px}
.eyebrow{color:var(--berry);font-size:15px;font-weight:700}.title{font-size:clamp(32px,7vw,54px);line-height:1.28;margin:14px 0 8px;letter-spacing:0}.sub{color:var(--muted);font-size:17px;line-height:1.8;margin:0 auto 28px;max-width:470px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px 0 22px}.unit{border:1px solid var(--line);border-radius:20px;padding:15px 6px 12px;background:linear-gradient(150deg,#fff,#fff5f9);box-shadow:0 8px 20px rgba(83,38,59,.05)}.number{display:block;font:800 clamp(26px,7vw,42px)/1.2 Tahoma,Arial,sans-serif;color:var(--berry);direction:ltr}.label{display:block;color:var(--muted);font-size:13px;margin-top:6px}.date{font-size:14px;color:#a45b7b;margin:16px 0 0}
form{display:none;margin-top:26px;text-align:right}form.ready{display:block}.prompt{display:block;text-align:center;color:var(--berry);font-weight:700;margin:0 0 14px}.password{width:100%;height:58px;border:1px solid #ead5df;border-radius:17px;padding:0 18px;background:#fff;font:600 20px Tahoma,Arial,sans-serif;direction:ltr;text-align:center;outline:none;transition:.2s}.password:focus{border-color:var(--pink);box-shadow:0 0 0 4px #ff4f931c}.open{width:100%;height:56px;margin-top:12px;border:0;border-radius:17px;color:#fff;background:linear-gradient(100deg,var(--pink),#ed5fa1 55%,var(--violet));font:700 18px 'RabieExact',Tahoma,sans-serif;cursor:pointer;box-shadow:0 12px 24px #e84f8d35;transition:transform .2s,filter .2s}.open:hover{transform:translateY(-2px);filter:saturate(1.1)}.message{min-height:24px;text-align:center;margin:12px 0 0;color:var(--berry);font-size:14px}.hint{margin-top:20px;color:#947b88;font-size:13px}

<main class="shell"><span class="spark one" aria-hidden="true">✦</span><span class="spark two" aria-hidden="true">♡</span>

<div class="unit"><span class="number" id="hours">--</span><span class="label">ساعة</span></div>

<input class="password" id="password" name="password" type="password" placeholder="كلمة السر" autocomplete="off" spellcheck="false" disabled>
<button class="open" type="submit" disabled>افتحي المفاجأة ♡</button>
<p class="message" id="message" aria-live="polite"></p>
</form>
<p class="hint" id="hint">الموعد المحدد: 1 أكتوبر 2026 عند منتصف الليل بتوقيت الرياض.</p>
</section></main>
<script>
(()=>{
 const target=Date.parse('2026-10-01T00:00:00+03:00');
 const ids={days:document.getElementById('days'),hours:document.getElementById('hours'),minutes:document.getElementById('minutes'),seconds:document.getElementById('seconds')};
 const form=document.getElementById('gateForm'),password=document.getElementById('password'),submit=form.querySelector('button'),countdown=document.getElementById('countdown'),status=document.getElementById('status'),hint=document.getElementById('hint'),message=document.getElementById('message');
 let unlocked=false;form.classList.add('ready');password.disabled=false;submit.disabled=false;
 function update(){
  const remaining=Math.max(0,target-Date.now()),total=Math.floor(remaining/1000);
  ids.days.textContent=Math.floor(total/86400);ids.hours.textContent=String(Math.floor(total%86400/3600)).padStart(2,'0');ids.minutes.textContent=String(Math.floor(total%3600/60)).padStart(2,'0');ids.seconds.textContent=String(total%60).padStart(2,'0');

 }
 update();const timer=window.setInterval(()=>{update();if(unlocked)window.clearInterval(timer)},1000);

})();
